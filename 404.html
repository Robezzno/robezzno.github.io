<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · SafTech</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0f14;color:#e6edf3;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;text-align:center}
.mono{font-family:"JetBrains Mono",monospace}
h1{font-size:clamp(2rem,8vw,4rem);margin:0 0 6px;letter-spacing:-.02em}
h1 span{color:#2ee6a6}
p{color:#9aa7b5;margin:0 0 18px;max-width:46ch}
canvas{background:#111823;border:1px solid #1f2a38;border-radius:14px;max-width:100%;touch-action:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
a.btn{background:#2ee6a6;color:#04120c;font-weight:600;padding:10px 18px;border-radius:10px;text-decoration:none}
a.ghost{background:transparent;color:#e6edf3;border:1px solid #1f2a38}
.score{color:#2ee6a6;font-size:.85rem;margin:10px 0 0}
kbd{font-family:"JetBrains Mono",monospace;font-size:.75em;border:1px solid #1f2a38;border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:#111823}
</style>
</head>
<body>
<p class="mono" style="color:#2ee6a6">404 · page not found · página no encontrada</p>
<h1>Te has salido del <span>mapa</span>.</h1>
<p>Esta URL no existe, pero la serpiente sí. <kbd>←↑↓→</kbd> o <kbd>WASD</kbd> · desliza en móvil. <br>This URL doesn't exist, but the snake does.</p>
<canvas id="g" width="320" height="320"></canvas>
<p class="score mono" id="s">score 0 · best 0</p>
<div class="row"><a class="btn" href="/">← Volver / Home</a><a class="btn ghost" href="/en/">English</a></div>
<script>
(function(){var c=document.getElementById("g"),x=c.getContext("2d"),N=16,S=c.width/N,snake,dir,next,food,score,best=0,dead,t;
try{best=+localStorage.getItem("saf-snake")||0}catch(e){}
function reset(){snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};next=dir;score=0;dead=false;spawn();draw()}
function spawn(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(function(p){return p.x===food.x&&p.y===food.y}))}
function step(){if(dead)return;dir=next;var h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
 if(snake.some(function(p){return p.x===h.x&&p.y===h.y})){dead=true;draw();return}
 snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;if(score>best){best=score;try{localStorage.setItem("saf-snake",best)}catch(e){}}spawn()}else snake.pop();draw()}
function draw(){x.fillStyle="#111823";x.fillRect(0,0,c.width,c.height);x.fillStyle="#1f2a38";for(var i=0;i<N;i++)for(var j=0;j<N;j++)x.fillRect(i*S+S/2-1,j*S+S/2-1,2,2);
 x.fillStyle="#ffcc66";x.fillRect(food.x*S+3,food.y*S+3,S-6,S-6);
 snake.forEach(function(p,i){x.fillStyle=i?"#1fbf88":"#2ee6a6";x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)});
 document.getElementById("s").textContent="score "+score+" · best "+best+(dead?" · GAME OVER · Enter/tap":"");
 if(dead){x.fillStyle="rgba(11,15,20,.7)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#e6edf3";x.font="700 26px Inter,sans-serif";x.textAlign="center";x.fillText("GAME OVER",c.width/2,c.height/2-6);x.font="13px JetBrains Mono,monospace";x.fillStyle="#2ee6a6";x.fillText("Enter / tap → restart",c.width/2,c.height/2+20)}}
function turn(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy}}
document.addEventListener("keydown",function(e){var k=e.key.toLowerCase();if(["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(k)>-1)e.preventDefault();
 if(k==="arrowup"||k==="w")turn(0,-1);else if(k==="arrowdown"||k==="s")turn(0,1);else if(k==="arrowleft"||k==="a")turn(-1,0);else if(k==="arrowright"||k==="d")turn(1,0);else if(k==="enter"&&dead)reset()});
var sx,sy;c.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;if(dead)reset()});
c.addEventListener("pointerup",function(e){if(sx==null)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)<10&&Math.abs(dy)<10)return;Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1)});
reset();t=setInterval(step,120)})();
</script>
</body>
</html>
